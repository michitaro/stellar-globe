stages:
  - build
  - bootstrap
  - package
  - deploy

default:
  interruptible: true

variables:
  REVIEW_APP_GATEWAY_NAMESPACE: "gateway-test"
  REVIEW_APP_GATEWAY_NAME: "microk8s-envoy"
  REVIEW_APP_GATEWAY_CLASS_NAME: "envoy"
  REVIEW_APP_GATEWAY_LISTENER_NAME: "http"
  REVIEW_APP_GATEWAY_ADDRESS: "133.40.210.133"
  REVIEW_APP_REGISTRY_PORT: "32000"
  REVIEW_APP_REGISTRY_NAMESPACE: "container-registry"
  REVIEW_APP_REGISTRY_SERVICE_NAME: "registry"

.review_app_branch_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
    - when: never

.review_app_stop_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

.review_app_bootstrap_rules:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never

.with_kubectl:
  before_script:
    - apk add --no-cache curl kubectl
    - |
      if [ -n "${REVIEW_APP_KUBECONFIG_B64:-}" ]; then
        mkdir -p "$CI_PROJECT_DIR/.kube"
        printf '%s' "$REVIEW_APP_KUBECONFIG_B64" | base64 -d > "$CI_PROJECT_DIR/.kube/config"
        export KUBECONFIG="$CI_PROJECT_DIR/.kube/config"
      fi

build_review_app:
  stage: build
  image: node:22-bookworm
  extends:
    - .review_app_branch_rules
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 python3-pip python3-venv
    - python3 -m pip install --break-system-packages --no-cache-dir uv
  script:
    - sh ci/review-app/build.sh
  artifacts:
    when: always
    paths:
      - dist/
      - python-integration/jupyterlite/playwright-report/
      - python-integration/jupyterlite/test-results/
    expire_in: 1 week

package_review_app:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  extends:
    - .review_app_branch_rules
  needs:
    - job: build_review_app
      artifacts: true
    - job: bootstrap_review_app_gateway
      artifacts: true
  script:
    - |
      IMAGE_REF="$(sh ci/review-app/package.sh)"
      REGISTRY_HOST="${IMAGE_REF%%/*}"
      printf '%s\n' "$IMAGE_REF" > review-app-image.txt
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/.github/skills/gitlab-microk8s-review-app-ci/bin/Dockerfile.nginx-static-review-app" \
        --destination "$IMAGE_REF" \
        --insecure-registry "$REGISTRY_HOST"
  artifacts:
    paths:
      - review-app-image.txt
    expire_in: 1 week

bootstrap_review_app_gateway:
  stage: bootstrap
  image: alpine:3.20
  extends:
    - .review_app_bootstrap_rules
    - .with_kubectl
  resource_group: review-app-bootstrap
  script:
    - sh .github/skills/gitlab-microk8s-review-app-ci/bin/bootstrap-microk8s-review-app.sh
  artifacts:
    reports:
      dotenv: review-app-bootstrap.env
    paths:
      - review-app-bootstrap.env
    expire_in: 1 week

deploy_review_app:
  stage: deploy
  image: alpine:3.20
  extends:
    - .review_app_branch_rules
    - .with_kubectl
  needs:
    - job: bootstrap_review_app_gateway
      artifacts: true
    - job: package_review_app
  resource_group: "review-app/$CI_COMMIT_REF_SLUG"
  script:
    - sh ci/review-app/deploy.sh
  artifacts:
    reports:
      dotenv: review-app.env
    paths:
      - review-app.env
    expire_in: 1 week
  environment:
    name: "review/$CI_COMMIT_REF_SLUG"
    url: "$REVIEW_APP_ENVIRONMENT_URL"
    on_stop: stop_review_app

stop_review_app:
  stage: deploy
  image: alpine:3.20
  extends:
    - .review_app_stop_rules
    - .with_kubectl
  allow_failure: true
  resource_group: "review-app/$CI_COMMIT_REF_SLUG"
  script:
    - sh ci/review-app/stop.sh
  environment:
    name: "review/$CI_COMMIT_REF_SLUG"
    action: stop
